<div class="login-container">
  <div class="login-box">
    <h2>Admin Login</h2>
    <p>Please enter your credentials to access the dashboard.</p>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <div class="form-group">
        <input type="text" formControlName="username" placeholder="Username">
      </div>

      <div class="form-group">
        <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Password">
      </div>

      <div class="show-password">
        <label>
          <input type="checkbox" [(ngModel)]="showPassword" [ngModelOptions]="{standalone: true}">
          Show password
        </label>
      </div>

      <button type="submit" [disabled]="loginForm.invalid || isLoading">Login</button>
    </form>
  </div>
</div>
