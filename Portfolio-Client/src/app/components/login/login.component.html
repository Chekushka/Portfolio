<div class="login-container">
  <div class="login-box">
    <h1>Admin login</h1>
    <p>Sign in to manage profiles and projects.</p>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()" novalidate>
      <div class="form-group">
        <label for="login-username">Username</label>
        <input id="login-username" type="text" formControlName="username" autocomplete="username">
      </div>

      <div class="form-group">
        <label for="login-password">Password</label>
        <input id="login-password" [type]="showPassword ? 'text' : 'password'" formControlName="password"
               autocomplete="current-password">
      </div>

      <div class="show-password">
        <label>
          <input type="checkbox" [(ngModel)]="showPassword" [ngModelOptions]="{standalone: true}">
          Show password
        </label>
      </div>

      @if (errorMessage) {
        <p class="form-error" role="alert">{{ errorMessage }}</p>
      }

      <button type="submit" [disabled]="loginForm.invalid || isLoading">
        {{ isLoading ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
  </div>
</div>
