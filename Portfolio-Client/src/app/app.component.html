<a class="skip-link" href="#main" (click)="skipToContent($event)">Skip to content</a>

<header class="main-nav">
  <nav class="nav-container" aria-label="Main">
    <a routerLink="/" class="logo">Serhii Chekun</a>

    <div class="links">
      @if (themeService.activeTheme()) {
        <div class="profile-switch" role="group" aria-label="Portfolio">
          <a routerLink="/unity" routerLinkActive="active" ariaCurrentWhenActive="page">Unity</a>
          <a routerLink="/dotnet" routerLinkActive="active" ariaCurrentWhenActive="page">.NET</a>
        </div>
      }

      @if (authService.isLoggedIn()) {
        <a class="nav-link" routerLink="/admin" routerLinkActive="active" ariaCurrentWhenActive="page">Admin</a>
        <button type="button" class="nav-link" (click)="logout()">Log out</button>
      }
    </div>
  </nav>
</header>

<main #main id="main" class="content-wrapper" tabindex="-1">
  <router-outlet></router-outlet>
</main>

<footer class="footer">
  <p>© {{ year }} Serhii Chekun</p>
  <p class="footer-built">Built with Angular and ASP.NET Core</p>
</footer>
