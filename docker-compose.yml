services:
  backend:
    build:
      context: ./Portfolio
      dockerfile: Dockerfile
    platform: linux/arm64
    restart: always
    volumes:
      - ./data:/app/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - internal

  nginx:
    image: nginx:stable-alpine
    platform: linux/arm64
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Portfolio-Client/dist/portfolio/browser:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge
