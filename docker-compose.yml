services:
  backend:
    build:
      context: ./Portfolio
      dockerfile: Dockerfile
    platform: linux/arm64
    restart: always
    environment:
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - AdminCredentials__Username=${ADMIN_USERNAME}
      - AdminCredentials__Password=${ADMIN_PASSWORD}
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION}
    volumes:
      - ./data:/app/data
    expose:
      - "8080"
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080' || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - internal

  nginx:
    image: nginx:stable-alpine
    platform: linux/arm64
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Portfolio-Client/dist/Portfolio-Client/browser:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge
